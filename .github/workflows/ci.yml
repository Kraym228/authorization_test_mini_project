name: Tests and Allure reports 

on: 
    push:
        branches:
            [ "main" ]
    workflow_dispatch:

permissions:
  contents: write
  pages: write
      
jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4
      
      - name: Download python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: download dependencies
        run: pip install -r requirements.txt
    
      - name: Install Chrome
        run: |
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable

      - name: Run tests
        run: pytest --alluredir=allure-results 

      - name: Get Allure report
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with: 
            ref: gh-pages
            path: gh-pages
      - name: Copy history from gh-pages
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/. allure-results/history/ 2>/dev/null || true

      - name: Install Allure CLI
        if: always()
        run: |
          wget -qO allure.tgz https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report



      - name: Upload Github Actions Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
            name: allure-report
            path: allure-report
        continue-on-error: true 

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: allure-report
            publish_branch: gh-pages
            keep_files: true 
